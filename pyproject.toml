[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lautsprecher-konstruktion"
version = "2.7.0"
description = "Desktop application for loudspeaker enclosure calculation, crossover design and manufacturing drawings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "numpy>=2.1",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pydantic>=2.9",
  "reportlab>=4.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pyinstaller>=6.11"
]

[project.scripts]
lautsprecher-konstruktion = "lautsprecher_konstruktion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lautsprecher_konstruktion"]

# SciPy and ReportLab ship no type information.
[[tool.mypy.overrides]]
module = ["scipy.*", "reportlab.*"]
ignore_missing_imports = true

# The Qt user interface is excluded from the strict gate (PySide6 stubs are incomplete);
# all calculation, export and data packages must pass.
[[tool.mypy.overrides]]
module = ["lautsprecher_konstruktion.ui.*", "lautsprecher_konstruktion.app"]
ignore_errors = true
