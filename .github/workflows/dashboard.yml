name: Update Project Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-dashboard-manual
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Generate dashboard
        run: python tools/generate_dashboard.py
      - name: Commit dashboard if changed
        shell: bash
        run: |
          if git diff --quiet -- coordination/DASHBOARD.md; then
            echo "Dashboard already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coordination/DASHBOARD.md
          git commit -m "chore(dashboard): refresh project overview"
          git push
